name: Paimon 1.0.0 compatibility

# Loams fork (FC1): manual only; no push, PR or schedule triggers.
on:
  workflow_dispatch: {}

concurrency:
  group: paimon1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  parity:
    if: ${{ github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: paimon1-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test upstream fork isolation
        run: python3 -m unittest discover -s bin -p test_paimon1_ci.py
      - name: Build release native libraries once for the complete reactor
        working-directory: native
        run: cargo build --workspace --lib --release --features mimalloc --locked --timings
      - name: Verify native JNI exports
        run: python3 bin/check-native-workspace.py --libraries native/target/release
      - name: Source and sink parity (reuse release libraries)
        run: >-
          mvn -B -ntp -Pflink-1.18,paimon1,bench -pl streamfusion-paimon1 -am
          -Dnative.build.skip=true
          -Dsf.testForks=1 '-Dtest=LegacyPaimon*Test,PaimonSourceSqlTest,PaimonSplitWatermarksTest,PaimonFetcherLifecycleTest'
          -Dsurefire.failIfNoSpecifiedTests=false '-Dsf.extraJvmArgs=-Xmx2g -XX:ActiveProcessorCount=2 --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED' test
      - name: Upstream SQL tests (reuse release libraries)
        env:
          SF_PAIMON1_TEST_FORKS: '1'
        run: >-
          bin/paimon1-suite.sh -Pbench -Dnative.build.skip=true
          -Dstreamfusion.flink-suite.retain-failed-warehouse=true
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paimon1-flink118-results
          path: |
            streamfusion-paimon1/target/surefire-reports/
            streamfusion-paimon1/target/upstream-suite/run.log
            streamfusion-paimon1/target/upstream-suite/inventory/
            streamfusion-paimon1/target/upstream-suite/diagnostics/
            streamfusion-paimon1/target/native-reports/
            native/target/cargo-timings/
