# The differential oracle: Apache Flink 2.2.1 (Apache-2.0) with its SQL
# Gateway, for loams-stream-conformance (FC1 Task 5, design 82 §3.2 and §15;
# preview). Adapted from ostrium-labs/loams deploy/release/compose.flink.yaml.
#
#   podman compose -f dev/oracle/compose.yaml up -d      # or: loams-stream-oracle up
#   podman compose -f dev/oracle/compose.yaml down       # or: loams-stream-oracle down
#
# - The official image, pinned by digest (the image design 81 pins, D1931).
#   The smoke corpus needs only what the distribution ships (datagen,
#   filesystem, json/debezium-json, csv), so no connector jars are layered.
# - Loopback only: the SQL Gateway on 127.0.0.1:${ORACLE_GATEWAY_PORT:-18083}
#   and the JobManager's REST API and UI on 127.0.0.1:${ORACLE_REST_PORT:-18081}.
# - ./work (created by the harness, git-ignored) is mounted at /oracle/work in
#   every container: case data under data/, filesystem sinks under sinks/,
#   checkpoints and savepoints under checkpoints/ and savepoints/.
# - Podman maps the invoking user to the image's flink user (uid 9999), so
#   everything Flink writes under ./work belongs to the caller.

x-flink: &flink
  image: ${ORACLE_FLINK_IMAGE:-docker.io/library/flink:2.2.1-scala_2.12-java21@sha256:521951efbfbb0cec74c2826446ce1d20a051bff18e6d3716a6affe97ddec692a}
  restart: "no"
  user: "9999:9999"
  userns_mode: "keep-id:uid=9999,gid=9999"
  entrypoint: ["/bin/sh", "-c"]
  environment:
    # The image's entrypoint writes this into jobmanager.rpc.address (else
    # each container's own hostname, and the TaskManager never registers).
    JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
  volumes:
    - ./config.yaml:/etc/oracle/config.yaml:ro,z
    - ./work:/oracle/work:z
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  flink-jobmanager:
    <<: *flink
    command:
      - set -eu; cp /etc/oracle/config.yaml "$$FLINK_HOME/conf/config.yaml"; exec /docker-entrypoint.sh jobmanager
    ports:
      - "127.0.0.1:${ORACLE_REST_PORT:-18081}:8081"
    healthcheck:
      # bash's /dev/tcp: the image has no curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  flink-taskmanager:
    <<: *flink
    command:
      - set -eu; cp /etc/oracle/config.yaml "$$FLINK_HOME/conf/config.yaml"; exec /docker-entrypoint.sh taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  # The image's entrypoint has no SQL Gateway role; start it directly.
  flink-sql-gateway:
    <<: *flink
    command:
      - set -eu; cp /etc/oracle/config.yaml "$$FLINK_HOME/conf/config.yaml"; exec "$$FLINK_HOME/bin/sql-gateway.sh" start-foreground
    ports:
      - "127.0.0.1:${ORACLE_GATEWAY_PORT:-18083}:8083"
    # After the TaskManager, not beside it: rootless Podman's crun has been
    # seen to fail one of two containers started at once in keep-id user
    # namespaces (writing net.ipv4.ping_group_range).
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
