# Flink 2.2.1 configuration for the differential oracle (FC1 Task 5; preview).
# Adapted from ostrium-labs/loams deploy/flink/compose/config.yaml (Apache-2.0,
# design 81 D1972-D1975): one JobManager, one TaskManager, the SQL Gateway.
# State and checkpoints go to the local work volume, not to object storage, so
# the oracle needs no RustFS. Everything that makes a run deterministic lives
# here or in the harness's session properties.
blob.server.port: 6124
execution.checkpointing.dir: file:///oracle/work/checkpoints
execution.checkpointing.savepoint-dir: file:///oracle/work/savepoints
execution.checkpointing.externalized-checkpoint-retention: DELETE_ON_CANCELLATION
execution.checkpointing.interval: '1 s'
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.num-retained: 1
high-availability.type: NONE
jobmanager.bind-host: 0.0.0.0
jobmanager.memory.process.size: 1600m
jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123
parallelism.default: 1
rest.address: flink-jobmanager
rest.bind-address: 0.0.0.0
rest.port: 8081
restart-strategy.type: none
sql-gateway.endpoint.rest.address: flink-sql-gateway
sql-gateway.endpoint.rest.bind-address: 0.0.0.0
sql-gateway.endpoint.rest.port: 8083
sql-gateway.endpoint.type: rest
sql-gateway.session.check-interval: '1 min'
sql-gateway.session.idle-timeout: '30 min'
sql-gateway.session.max-num: 100
state.backend.type: hashmap
taskmanager.bind-host: 0.0.0.0
taskmanager.memory.process.size: 2048m
taskmanager.numberOfTaskSlots: 8
taskmanager.rpc.port: 6122
table.local-time-zone: UTC
web.cancel.enable: true
web.submit.enable: false
