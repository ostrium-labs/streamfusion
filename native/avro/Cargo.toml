[package]
name = "streamfusion-avro"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
streamfusion-bridge = { path = "../bridge" }
streamfusion-format-support = { path = "../format-support" }
arrow.workspace = true
jni.workspace = true
arrow-avro.workspace = true
serde_json.workspace = true

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
default = []
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]

[dev-dependencies]
criterion.workspace = true
streamfusion-benchmark-support.workspace = true

[[bench]]
name = "avro_decode"
harness = false

# Inherited from StreamFusion: these findings predate the Loams fork. They are allowed here so
# `clippy -D warnings` is clean workspace-wide while new crates stay strict; fix incrementally
# (FC1 ruling R4.5).
[lints.clippy]
needless_range_loop = "allow"

[lints.rust]
dead_code = "allow"
