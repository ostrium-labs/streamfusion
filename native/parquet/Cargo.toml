[package]
name = "streamfusion-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
streamfusion-bridge = { path = "../bridge" }
arrow.workspace = true
jni.workspace = true
parquet.workspace = true
bytes = "1"

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
default = []
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]

[dev-dependencies]
criterion.workspace = true
streamfusion-benchmark-support.workspace = true
jni = { workspace = true, features = ["invocation"] }

[[bench]]
name = "parquet_io"
harness = false

[[bench]]
name = "parquet_host_reader"
harness = false

# Inherited from StreamFusion: these findings predate the Loams fork. They are allowed here so
# `clippy -D warnings` is clean workspace-wide while new crates stay strict; fix incrementally
# (FC1 ruling R4.5).
[lints.clippy]
items_after_test_module = "allow"
cloned_ref_to_slice_refs = "allow"
needless_borrow = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
