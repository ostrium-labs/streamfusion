[package]
name = "streamfusion"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
streamfusion-bridge = { path = "../bridge", default-features = false }
arrow = { workspace = true, features = ["json"] }
arrow-ord.workspace = true
jni = { workspace = true, optional = true }
datafusion.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
regex.workspace = true
md-5.workspace = true
sha2.workspace = true
sha1.workspace = true
log.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
tokio.workspace = true
futures.workspace = true
ahash.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
simd-json.workspace = true
stacker = "0.1.24"
zstd = "0.13"
lz4_flex = "0.13"
lzokay = "2.0.1"

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
# `jni` builds the JNI entry points the Maven plugin loads. A standalone build (loams-stream)
# turns default features off and links no `jni`.
default = ["jni", "rocksdb-state"]
jni = ["dep:jni", "streamfusion-bridge/jni"]
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]
rocksdb-state = ["dep:rocksdb", "dep:bytes"]
rocksdb-io-uring = ["rocksdb-state", "rocksdb/io-uring"]
# `pub mod semantics`: the Flink value kernels loams-stream-sql reuses (FC1 Task 4). Off by default.
semantics = []

[dependencies.rocksdb]
workspace = true
optional = true

[dependencies.bytes]
workspace = true
optional = true

[dev-dependencies]
jni = { workspace = true, features = ["invocation"] }
tempfile = "3"
criterion.workspace = true
streamfusion-benchmark-support.workspace = true
bytes = "1"

