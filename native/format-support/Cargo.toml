[package]
name = "streamfusion-format-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
streamfusion-bridge = { path = "../bridge" }
arrow.workspace = true
jni.workspace = true

[dev-dependencies]
criterion.workspace = true
streamfusion-benchmark-support.workspace = true

[[bench]]
name = "raw_decode"
harness = false

# Inherited from StreamFusion: these findings predate the Loams fork. They are allowed here so
# `clippy -D warnings` is clean workspace-wide while new crates stay strict; fix incrementally
# (FC1 ruling R4.5).
[lints.clippy]
too_many_arguments = "allow"
not_unsafe_ptr_arg_deref = "allow"

[lints.rust]
function_casts_as_integer = "allow"
