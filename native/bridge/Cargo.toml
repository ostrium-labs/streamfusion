[package]
name = "streamfusion-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
arrow.workspace = true
jni = { workspace = true, optional = true }
ahash.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
chrono.workspace = true
base64.workspace = true

[features]
# JVM handles, the panic-to-exception guard and the JNI prelude types. On by default for the
# format crates; the engine forwards its own `jni` feature here.
default = ["jni"]
jni = ["dep:jni"]

[dev-dependencies]
criterion.workspace = true
streamfusion-benchmark-support.workspace = true

[[bench]]
name = "handoffs"
harness = false
