[package]
name = "streamfusion-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
streamfusion-bridge = { path = "../bridge" }
arrow = { workspace = true, features = ["json"] }
jni.workspace = true
arrow-avro.workspace = true
prost-reflect.workspace = true
prost.workspace = true
prost-types.workspace = true
chrono.workspace = true
base64.workspace = true
serde_json.workspace = true
memchr.workspace = true

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
default = []
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]

[dev-dependencies]
criterion.workspace = true
streamfusion-benchmark-support.workspace = true

[[bench]]
name = "kafka_sink"
harness = false

[[bench]]
name = "format_encode"
harness = false

# Inherited from StreamFusion: these findings predate the Loams fork. They are allowed here so
# `clippy -D warnings` is clean workspace-wide while new crates stay strict; fix incrementally
# (FC1 ruling R4.5).
[lints.clippy]
too_many_arguments = "allow"
sliced_string_as_bytes = "allow"
manual_is_multiple_of = "allow"
match_like_matches_macro = "allow"
