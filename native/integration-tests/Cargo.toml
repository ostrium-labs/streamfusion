[package]
name = "streamfusion-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]

[dev-dependencies]
streamfusion-kafka = { path = "../kafka" }
streamfusion-protobuf = { path = "../protobuf" }
