[package]
name = "streamfusion-json"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
streamfusion-bridge = { path = "../bridge" }
streamfusion-format-support = { path = "../format-support" }
arrow = { workspace = true, features = ["json"] }
jni.workspace = true
simd-json.workspace = true
num-traits.workspace = true
num-bigint.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
default = []
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]

[dev-dependencies]
criterion.workspace = true
streamfusion-benchmark-support.workspace = true
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5.8"

[[bench]]
name = "json_codecs"
harness = false

[[bench]]
name = "json_decode"
harness = false

# Inherited from StreamFusion: these findings predate the Loams fork. They are allowed here so
# `clippy -D warnings` is clean workspace-wide while new crates stay strict; fix incrementally
# (FC1 ruling R4.5).
[lints.clippy]
unnecessary_cast = "allow"
too_many_arguments = "allow"
needless_borrow = "allow"
manual_is_ascii_check = "allow"
